# Render Blueprint for the Colón Quest FastAPI backend (SCRUM-52).
# Deploys from `develop` while the game is in development; switch to `main` for judging.
# Only after GitHub Actions CI passes.
services:
  - type: web
    name: colon-quest-api
    runtime: python
    branch: develop
    region: ohio  # next to the Neon database (us-east-2)
    rootDir: server
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: pip install --upgrade uv && uv sync --frozen --no-dev
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MODEL_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GAME_MASTER_MODEL
        value: "muse-spark-1.3"  # Wonder took 6-10 s even at minimal effort; Unity waits 8 s
      - key: LIVE_REASONING_EFFORT
        value: "minimal"
      - key: IMAGE_TIMEOUT_S
        value: "30"
      - key: SUMMARY_MODEL
        value: "muse-wonder-1.0"  # behind a loading screen, 5-8 s measured on Oct 29
      - key: SUMMARY_TIMEOUT_S
        value: "25"
      - key: CLASS_REPORT_MODEL
        value: "muse-spark-1.3"
      - key: DAILY_BUDGET_USD
        value: "5.0"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLIENT_HASH_SALT
        generateValue: true
      - key: AGENTIC_GAME_MASTER
        value: "true"
      - key: SEASON_PLANNER
        value: "true"
      - key: PLANNER_MODEL
        value: "muse-wonder-1.0"  # runs in the background after the first event
      - key: PLANNER_TIMEOUT_S
        value: "30"
      - key: SELLER_AGENT
        value: "false"
      - key: NPC_PROVIDER
        value: "open_weights"
      - key: OPEN_WEIGHTS_TIMEOUT_S
        value: "5"
      - key: OPEN_WEIGHTS_BASE_URL
        value: "https://inference.baseten.co/v1"
      - key: OPEN_WEIGHTS_NPC_MODEL
        value: "meta-models/muse-spark-open-1026"
      - key: OPEN_WEIGHTS_API_KEY
        sync: false
