name: Bug report
description: Report something that is broken
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Day-to-day work is tracked in Jira (project `CQ`). Use this form for bugs found by players or reviewers.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new session
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web (WebGL)
        - Desktop
        - Backend / API
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
