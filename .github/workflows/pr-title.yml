name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Title and branch reference a Jira ticket
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+ \[CQ-[0-9]+\]$'
          if [[ "$BRANCH" == dependabot/* ]]; then
            echo "Dependabot PR, skipping Jira check."
            exit 0
          fi
          if [[ "$BRANCH" == "develop" && "$BASE" == "main" ]]; then
            if [[ "$TITLE" =~ ^release:\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release PR title is valid."
              exit 0
            fi
            echo "::error::Release PRs from develop to main must be titled 'release: vX.Y.Z'. Got: '$TITLE'"
            exit 1
          fi
          if [[ "$BASE" == "main" && "$BRANCH" != hotfix/* ]]; then
            echo "::error::Only 'develop' (release) or 'hotfix/*' branches may target main. Open this PR against develop."
            exit 1
          fi
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'feat(server): add health endpoint [CQ-7]'. Got: '$TITLE'"
            exit 1
          fi
          if [[ ! "$BRANCH" =~ CQ-[0-9]+ ]]; then
            echo "::error::Branch name must include the Jira key, e.g. 'feat/CQ-7-health-endpoint'. Got: '$BRANCH'"
            exit 1
          fi
          echo "PR title and branch follow the conventions."
