<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
  <title id="t">Architecture</title>
  <desc id="d">The Unity 2D client, which runs the C# finance engine on WebGL and desktop, talks JSON with a FastAPI backend that holds the Pydantic contracts, the cost guard, the cache and the agents. The backend calls the Meta Model API (Wonder, Spark, Voice and Image), stores sessions, decisions and model calls in Neon Postgres, and can optionally run the characters on open-weight models hosted on Baseten or Modal.</desc>
  <style>
    .h { font: 800 30px ui-monospace, "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; fill: #1d1a16; letter-spacing: 1px; }
    .num { font: 700 18px ui-monospace, "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; fill: #b3261e; }
    .title { font: 800 56px ui-monospace, "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; fill: #1d1a16; letter-spacing: 2px; }
    .tagline { font: italic 500 24px Georgia, "Iowan Old Style", "Times New Roman", serif; fill: #4f4536; }
    .event { font: 700 16px ui-monospace, "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; fill: #fbf6ea; letter-spacing: 1px; }
    .label { font: 800 22px ui-monospace, "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; fill: #1d1a16; }
    .label-sm { font: 800 20px ui-monospace, "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; fill: #1d1a16; }
    .detail { font: 500 18px Georgia, "Iowan Old Style", "Times New Roman", serif; fill: #4f4536; }
    .detail-sm { font: 500 16px Georgia, "Iowan Old Style", "Times New Roman", serif; fill: #4f4536; }
    .step { font: 700 14px ui-monospace, "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; fill: #b3261e; }
    .pct { font: 800 24px ui-monospace, "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; fill: #b3261e; }
    .stamp { font: 800 18px ui-monospace, "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; fill: #b3261e; letter-spacing: 2px; }
    .rule { font: 500 18px Georgia, "Iowan Old Style", "Times New Roman", serif; fill: #1d1a16; }
    .strong { font-weight: 700; }
    .blink { animation: blink 1s steps(1) infinite; }
    .bob { animation: bob 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    .p1 { animation: p1 3s steps(30) infinite; }
    .p2 { animation: p2 4s steps(40) infinite; }
    .p3 { animation: p3 4s steps(40) 1.3s infinite; }
    .p4 { animation: p4 4s steps(40) 2.6s infinite; }
    @keyframes p1 { 0% { transform: translate(0, 0); } 50% { transform: translate(56px, 0); } 100% { transform: translate(0, 0); } }
    @keyframes p2 { 0% { transform: translate(0, 0); } 30% { transform: translate(0, 52px); } 100% { transform: translate(-456px, 52px); } }
    @keyframes p3 { 0% { transform: translate(0, 0); } 60% { transform: translate(0, 52px); } 100% { transform: translate(-200px, 52px); } }
    @keyframes p4 { 0% { transform: translate(0, 0); } 40% { transform: translate(0, 52px); } 100% { transform: translate(56px, 52px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .hide-still { opacity: 0; }
    }
  </style>
  <rect x="0" y="0" width="800" height="400" fill="#f3ead7"/>
  <rect x="30" y="30" width="330" height="128" fill="#1d1a16"/><rect x="24" y="24" width="330" height="128" fill="#fbf6ea" stroke="#1d1a16" stroke-width="3"/><text class="label-sm" x="189" y="58" text-anchor="middle">Unity 2D client</text><text class="detail-sm" x="189" y="86" text-anchor="middle">WebGL and desktop</text><text class="detail-sm" x="189" y="108" text-anchor="middle">C# finance engine</text>
  <rect x="446" y="30" width="330" height="128" fill="#1d1a16"/><rect x="440" y="24" width="330" height="128" fill="#fbf6ea" stroke="#1d1a16" stroke-width="3"/><text class="label-sm" x="605" y="58" text-anchor="middle">FastAPI backend</text><text class="detail-sm" x="605" y="86" text-anchor="middle">Pydantic v2 contracts</text><text class="detail-sm" x="605" y="108" text-anchor="middle">cost guard, cache, agents</text>
  <line x1="360" y1="88" x2="434" y2="88" stroke="#1d1a16" stroke-width="4"/>
  <text class="step" x="397" y="78" text-anchor="middle">JSON</text>
  <line x1="605" y1="158" x2="605" y2="212" stroke="#1d1a16" stroke-width="4"/>
  <line x1="139" y1="212" x2="661" y2="212" stroke="#1d1a16" stroke-width="4"/>
  <line x1="139" y1="212" x2="139" y2="250" stroke="#1d1a16" stroke-width="4"/>
  <line x1="405" y1="212" x2="405" y2="250" stroke="#1d1a16" stroke-width="4"/>
  <line x1="661" y1="212" x2="661" y2="250" stroke="#1d1a16" stroke-width="4" stroke-dasharray="6 5"/>
  <rect x="30" y="256" width="230" height="126" fill="#1d1a16"/><rect x="24" y="250" width="230" height="126" fill="#fbf6ea" stroke="#1d1a16" stroke-width="3"/><text class="label-sm" x="139" y="284" text-anchor="middle">Meta Model API</text><text class="detail-sm" x="139" y="312" text-anchor="middle">Wonder, Spark,</text><text class="detail-sm" x="139" y="334" text-anchor="middle">Voice and Image</text>
  <rect x="296" y="256" width="230" height="126" fill="#1d1a16"/><rect x="290" y="250" width="230" height="126" fill="#fbf6ea" stroke="#1d1a16" stroke-width="3"/><text class="label-sm" x="405" y="284" text-anchor="middle">Neon Postgres</text><text class="detail-sm" x="405" y="312" text-anchor="middle">sessions, decisions,</text><text class="detail-sm" x="405" y="334" text-anchor="middle">model calls</text>
  <rect x="556" y="250" width="214" height="126" fill="#f3ead7" stroke="#1d1a16" stroke-width="3" stroke-dasharray="8 6"/><text class="label-sm" x="663" y="284" text-anchor="middle">Open weights</text><text class="detail-sm" x="663" y="312" text-anchor="middle">optional NPCs</text><text class="detail-sm" x="663" y="334" text-anchor="middle">Baseten or Modal</text>
  <rect class="p1 hide-still" x="364" y="83" width="10" height="10" fill="#e2a92b" stroke="#1d1a16" stroke-width="2"/>
  <rect class="p2 hide-still" x="600" y="160" width="10" height="10" fill="#e2a92b" stroke="#1d1a16" stroke-width="2"/>
  <rect class="p3 hide-still" x="600" y="160" width="10" height="10" fill="#1f4e8c" stroke="#1d1a16" stroke-width="2"/>
  <rect class="p4 hide-still" x="600" y="160" width="10" height="10" fill="#b3261e" stroke="#1d1a16" stroke-width="2"/>
</svg>
