<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" width="800" height="358" role="img" aria-labelledby="t d">
  <title id="t">Meta models</title>
  <desc id="d">Muse Wonder is the game master and the voice of the characters. Muse Spark writes the season plan, the year-end summary and Class Mode reports. Muse Voice Transcribe turns the voice of the player into text while negotiating. Muse Image draws pixel-art portraits, pre-generated and cached.</desc>
