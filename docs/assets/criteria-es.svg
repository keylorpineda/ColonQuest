  <title id="t">Criterios del jurado</title>
  <desc id="d">Impacto 30 por ciento: telemetría, Modo Clase y una prueba piloto con estudiantes. Herramientas de Meta 25 por ciento: cuatro modelos, cada uno con un rol. Demo 25 por ciento: un link que nunca se cae por un modelo. Profundidad técnica 20 por ciento: contratos validados y un motor exacto.</desc>
