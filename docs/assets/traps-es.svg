<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" width="800" height="358" role="img" aria-labelledby="t d">
  <title id="t">Las trampas</title>
  <desc id="d">Cuatro trampas que el juego enseña a detectar: cuotas con un seguro que nadie mencionó; pagar solo el mínimo de la tarjeta mientras la deuda crece; prestamistas gota a gota con plata rápida e intereses semanales; y esquemas piramidales que te pagan por meter amigos.</desc>
