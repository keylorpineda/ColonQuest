    @keyframes stamp2 { 0% { opacity: 0; } 46% { opacity: 1; } 92% { opacity: 0; } }
    .stamp3 { animation: stamp3 8s steps(1) infinite; }
    @keyframes stamp3 { 0% { opacity: 0; } 64% { opacity: 1; } 92% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .hide-still { opacity: 0; }
    }
