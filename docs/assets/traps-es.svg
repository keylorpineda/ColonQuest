    .rule { font: 500 18px Georgia, "Iowan Old Style", "Times New Roman", serif; fill: #1d1a16; }
    .strong { font-weight: 700; }
    .blink { animation: blink 1s steps(1) infinite; }
    .bob { animation: bob 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    .stamp0 { animation: stamp0 8s steps(1) infinite; }
    @keyframes stamp0 { 0% { opacity: 0; } 10% { opacity: 1; } 92% { opacity: 0; } }
    .stamp1 { animation: stamp1 8s steps(1) infinite; }
    @keyframes stamp1 { 0% { opacity: 0; } 28% { opacity: 1; } 92% { opacity: 0; } }
